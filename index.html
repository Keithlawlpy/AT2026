<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AT2026 Cloud computing prototype</title>
</head>
<body>

    <!-- Story text and buttons-->
    <h1>Two Stories, One Connection</h1>
    <p>Welcome to the prototype.</p>
    <p>Player choices will eventually affect each other's stories.</p>


    <button id="forestButton">Enter the forest</button>
    <button id="riverButton">Follow the river</button>

    <p id="storyText">You arrive at a crossroads. Which path will you choose?</p>

    <p id="choiceText">You haven't made a choice yet.</p>



    <!-- show status of cloud data-->
    <h2>Saved cloud choices</h2>
    <button id="loadChoicesButton">Load saved choices</button>
    <p id="cloudStatus">Cloud data has not been loaded yet.</p>
    <ul id="savedChoices"></ul>



    <!-- Connect to Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- External script for app logic -->
    <script src="js/main.js"></script>
</body>

</html>
